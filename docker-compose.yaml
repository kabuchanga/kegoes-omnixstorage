version: '3.8'  # Note: Coolify compatible. Version attribute is legacy in modern Docker but kept for tool compatibility.

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.11
    container_name: omnix-etcd
    hostname: etcd
    environment:
      - ETCD_NAME=etcd0
      - ETCD_DATA_DIR=/etcd-data
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://etcd:2380
      - ETCD_INITIAL_CLUSTER=etcd0=http://etcd:2380
      - ETCD_INITIAL_CLUSTER_TOKEN=omnix-single-node
      - ETCD_INITIAL_CLUSTER_STATE=new
      - ETCD_AUTO_COMPACTION_RETENTION=1
      - ETCD_QUOTA_BACKEND_BYTES=8589934592
      - ETCD_ENABLE_V2=true
    ports:
      - "2379:2379"
      - "2380:2380"
    volumes:
      - etcd-data:/etcd-data
    networks:
      - omnix-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://localhost:2379", "endpoint", "health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s

  omnix-node1:
    image: kegeossolutions/omnixstorage:${OMNIX_TAG:-omnixstorage}
    pull_policy: always
    container_name: omnix-node1
    hostname: omnix-node1
    labels:
      # Traefik configuration for Coolify reverse proxy routing
      - "traefik.enable=true"
      # Service definition
      - "traefik.http.services.omnixstorage-api.loadbalancer.server.port=5000"
      # Router for port 9000 (public API endpoint)
      - "traefik.http.routers.omnixstorage-api.rule=Host(`${OMNIX_PUBLIC_DOMAIN:-localhost}`) && PathPrefix(`/health`, `/s3`, `/api`, `/bucket`)"
      - "traefik.http.routers.omnixstorage-api.entrypoints=websecure"
      - "traefik.http.routers.omnixstorage-api.tls=true"
      - "traefik.http.routers.omnixstorage-api.priority=10"
    environment:
      - NODE_NAME=node1
      - IS_SEED_NODE=true
      - CLUSTER_NODES=node1=http://omnix-node1:5000
      - ETCD_ENDPOINTS=http://etcd:2379
      - USE_REPLICATION_MODE=true
      - REPLICATION_FACTOR=1
      - MIN_WRITE_QUORUM=1
      - ERASURE_DATA_SHARDS=1
      - ERASURE_PARITY_SHARDS=0
      - RAFT_ELECTION_TIMEOUT_MS=3000
      - RAFT_HEARTBEAT_INTERVAL_MS=1000
      - CLUSTER_PEERS=
      - ASPNETCORE_Kestrel__Limits__MaxConcurrentConnections=1000
      - ASPNETCORE_Kestrel__Limits__MaxRequestBodySize=5368709120
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - Auth__DefaultUsername=${OMNIX_ADMIN_USER:-admin}
      - Auth__DefaultPassword=${OMNIX_ADMIN_PASSWORD:-omnix-console-2026}
      - S3__RootAccessKey=${OMNIX_S3_ACCESS_KEY:-admin}
      - S3__RootSecretKey=${OMNIX_S3_SECRET_KEY:-omnix-secret-2026}
    ports:
      - "9000:5000"
      - "5001:5001"
    volumes:
      - node1-data:/data
      - omnix-keys:/data/keys
    networks:
      - omnix-network
    restart: unless-stopped
    depends_on:
      etcd:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4'
        reservations:
          memory: 4G
          cpus: '2'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  console:
    image: kegeossolutions/omnix-console:${OMNIX_TAG:-omnixstorage}
    pull_policy: always
    container_name: omnix-console
    labels:
      # Traefik configuration for Coolify reverse proxy routing
      - "traefik.enable=true"
      # Service definition
      - "traefik.http.services.omnixstorage-console.loadbalancer.server.port=80"
      # Router for console (port 3001, default route)
      - "traefik.http.routers.omnixstorage-console.rule=Host(`${OMNIX_PUBLIC_DOMAIN:-localhost}`)"
      - "traefik.http.routers.omnixstorage-console.entrypoints=websecure"
      - "traefik.http.routers.omnixstorage-console.tls=true"
      - "traefik.http.routers.omnixstorage-console.priority=1"
    environment:
      # When behind Coolify's reverse proxy with SSL termination:
      # - Coolify terminates HTTPS and forwards HTTP internally
      # - Set VITE_API_URL to the public HTTPS domain (internally use http://omnix-node1:5000)
      # - Coolify automatically manages Let's Encrypt SSL renewal
      - VITE_API_URL=${OMNIX_CONSOLE_API_URL:-http://omnix-node1:5000}
    ports:
      - "3001:80"
    networks:
      - omnix-network
    restart: unless-stopped
    depends_on:
      omnix-node1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  omnix-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16

volumes:
  etcd-data:
    driver: local
  node1-data:
    driver: local
  omnix-keys:
    driver: local

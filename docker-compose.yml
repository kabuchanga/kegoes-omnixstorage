version: '3.8'

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.11
    container_name: omnix-etcd
    hostname: etcd
    environment:
      - ETCD_NAME=etcd0
      - ETCD_DATA_DIR=/etcd-data
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://etcd:2380
      - ETCD_INITIAL_CLUSTER=etcd0=http://etcd:2380
      - ETCD_INITIAL_CLUSTER_TOKEN=omnix-single-node
      - ETCD_INITIAL_CLUSTER_STATE=new
      - ETCD_AUTO_COMPACTION_RETENTION=1
      - ETCD_QUOTA_BACKEND_BYTES=8589934592
      - ETCD_ENABLE_V2=true
    ports:
      - "2379:2379"
      - "2380:2380"
    volumes:
      - etcd-data:/etcd-data
    networks:
      - omnix-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  omnix-node1:
    image: kegeossolutions/omnixstorage:${OMNIX_TAG:-omnixstorage}
    pull_policy: always
    container_name: omnix-node1
    hostname: omnix-node1
    environment:
      - NODE_NAME=node1
      - IS_SEED_NODE=true
      - CLUSTER_NODES=node1=http://omnix-node1:5000
      - ETCD_ENDPOINTS=http://etcd:2379
      - USE_REPLICATION_MODE=true
      - REPLICATION_FACTOR=1
      - MIN_WRITE_QUORUM=1
      - ERASURE_DATA_SHARDS=1
      - ERASURE_PARITY_SHARDS=0
      - RAFT_ELECTION_TIMEOUT_MS=3000
      - RAFT_HEARTBEAT_INTERVAL_MS=1000
      - CLUSTER_PEERS=
      - ASPNETCORE_Kestrel__Limits__MaxConcurrentConnections=1000
      - ASPNETCORE_Kestrel__Limits__MaxRequestBodySize=5368709120
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      - Auth__DefaultUsername=${OMNIX_ADMIN_USER:-admin}
      - Auth__DefaultPassword=${OMNIX_ADMIN_PASSWORD:-omnix-console-2026}
      - S3__RootAccessKey=${OMNIX_S3_ACCESS_KEY:-admin}
      - S3__RootSecretKey=${OMNIX_S3_SECRET_KEY:-omnix-secret-2026}
    volumes:
      - node1-data:/data
      - omnix-keys:/data/keys
    networks:
      - omnix-network
    restart: unless-stopped
    depends_on:
      etcd:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4'
        reservations:
          memory: 4G
          cpus: '2'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  console:
    image: kegeossolutions/omnix-console:${OMNIX_TAG:-omnixstorage}
    pull_policy: always
    container_name: omnix-console
    environment:
      - VITE_API_URL=${OMNIX_CONSOLE_API_URL:-}
    ports:
      - "3001:80"
    networks:
      - omnix-network
    restart: unless-stopped
    depends_on:
      - omnix-node1

networks:
  omnix-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16

volumes:
  etcd-data:
    driver: local
  node1-data:
    driver: local
  omnix-keys:
    driver: local

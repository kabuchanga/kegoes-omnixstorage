version: '3.8'

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.11
    container_name: omnix-etcd
    hostname: etcd
    environment:
      - ETCD_NAME=etcd0
      - ETCD_DATA_DIR=/etcd-data
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://etcd:2379
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://etcd:2380
      - ETCD_INITIAL_CLUSTER=etcd0=http://etcd:2380
      - ETCD_INITIAL_CLUSTER_TOKEN=omnix-single-node
      - ETCD_INITIAL_CLUSTER_STATE=new
      - ETCD_AUTO_COMPACTION_RETENTION=1
      - ETCD_QUOTA_BACKEND_BYTES=8589934592
      - ETCD_ENABLE_V2=true
    ports:
      - "2379:2379"
      - "2380:2380"
    volumes:
      - etcd-data:/etcd-data
    networks:
      - omnix-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  omnix-node1:
    image: kegeossolutions/omnixstorage:${OMNIX_TAG:-omnixstorage}
    pull_policy: always
    container_name: omnix-node1
    hostname: omnix-node1
    environment:
      - NODE_NAME=node1
      - IS_SEED_NODE=true
      - CLUSTER_NODES=node1=http://omnix-node1:5000
      - ETCD_ENDPOINTS=http://etcd:2379
      - USE_REPLICATION_MODE=true
      - REPLICATION_FACTOR=1
      - MIN_WRITE_QUORUM=1
      - ERASURE_DATA_SHARDS=1
      - ERASURE_PARITY_SHARDS=0
      - RAFT_ELECTION_TIMEOUT_MS=3000
      - RAFT_HEARTBEAT_INTERVAL_MS=1000
      - CLUSTER_PEERS=
      - ASPNETCORE_Kestrel__Limits__MaxConcurrentConnections=1000
      - ASPNETCORE_Kestrel__Limits__MaxRequestBodySize=5368709120
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:5000
      
      # Authentication
      - Auth__DefaultUsername=${OMNIX_ADMIN_USER:-admin}
      - Auth__DefaultPassword=${OMNIX_ADMIN_PASSWORD:-omnix-console-2026}
      - Auth__AdminUsersFile=/data/keys/admin-users.json
      - Auth__Jwt__Issuer=${OMNIX_JWT_ISSUER:-http://localhost:9000}
      - Auth__Jwt__Audience=${OMNIX_JWT_AUDIENCE:-omnixstorage-api}
      
      # S3 API
      - S3__RootAccessKey=${OMNIX_S3_ACCESS_KEY:-AKIATESAFEKEY0000001}
      - S3__RootSecretKey=${OMNIX_S3_SECRET_KEY:-wJalrXUtnFEMIaKkMDENGbPxRfIcxAmPlEkEyZaB}
      - S3__Region=${OMNIX_S3_REGION:-us-east-1}
      - S3__MaxClockSkewMinutes=${OMNIX_S3_MAX_CLOCK_SKEW:-15}
      
      # Tenant default quotas
      - Tenant__DefaultRequestsPerMinute=${OMNIX_TENANT_DEFAULT_REQUESTS_PER_MIN:-10000}
      - Tenant__DefaultBandwidthPerDay=${OMNIX_TENANT_DEFAULT_BANDWIDTH_PER_DAY:-1099511627776}
      
      # Storage
      - Storage__DataPath=/data/chunks
      - Storage__RsaKeyPath=/data/keys/omnix-rsa-key.bin
      - RSA_KEY_PATH=/data/keys/omnix-rsa-key.bin
      
      # Network
      - Network__ShardTransferTimeoutSeconds=${OMNIX_SHARD_TRANSFER_TIMEOUT:-3}
      - Network__JwtClockSkewSeconds=${OMNIX_JWT_CLOCK_SKEW:-30}
      
      # Vector Search
      - VectorSearch__MaxConnections=${OMNIX_VECTOR_MAX_CONNECTIONS:-16}
      - VectorSearch__EfConstruction=${OMNIX_VECTOR_EF_CONSTRUCTION:-200}
      - VectorSearch__EfSearch=${OMNIX_VECTOR_EF_SEARCH:-50}
      
      # CORS configuration
      - CORS__AllowedOrigins=${OMNIX_CORS_ALLOWED_ORIGINS:-http://localhost:3000,https://coolify.kegeosapps.com,http://149.102.142.7,https://console.storage.kegeosapps.com,http://localhost:3001,http://37.60.228.216:9000,http://localhost:9000,http://37.60.228.216:3001,http://localhost:5173,https://edgesentience.kegeosapps.com,https://api.edgesentience.kegeosapps.com,https://ingest.edgesentience.kegeosapps.com,https://dashboardapi.edgesentience.kegeosapps.com}      - CORS__AllowedMethods=${OMNIX_CORS_ALLOWED_METHODS:-*}
      - CORS__AllowedHeaders=${OMNIX_CORS_ALLOWED_HEADERS:-*}
      - CORS__AllowCredentials=${OMNIX_CORS_ALLOW_CREDENTIALS:-true}
      - CORS__MaxAge=${OMNIX_CORS_MAX_AGE:-86400}
    ports:
      - "9000:5000"
      - "5001:5001"
    volumes:
      - node1-data:/data
      - omnix-keys:/data/keys
    networks:
      - omnix-network
    restart: unless-stopped
    depends_on:
      etcd:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4'
        reservations:
          memory: 4G
          cpus: '2'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  console:
    image: kegeossolutions/omnix-console:${OMNIX_TAG:-omnixstorage}
    pull_policy: always
    container_name: omnix-console
    environment:
      - VITE_API_URL=${OMNIX_CONSOLE_API_URL:-http://localhost:9000}
    ports:
      - "3001:80"
    networks:
      - omnix-network
    restart: unless-stopped
    depends_on:
      - omnix-node1
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  omnix-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16

volumes:
  etcd-data:
    driver: local
  node1-data:
    driver: local
  omnix-keys:
    driver: local
